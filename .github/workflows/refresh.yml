name: Refresh market data (hourly)

on:
  schedule:
    - cron: "17 * * * *"  # hourly, offset to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live market data (server-side)
        run: python3 scripts/fetch.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "taskmarket-pulse-bot"
          git config user.email "taskmarket-pulse-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: hourly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
      - name: Assemble the published site (page + data only)
        run: |
          mkdir -p _site
          cp index.html data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
